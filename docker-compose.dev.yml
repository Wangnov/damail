# 开发环境：Postgres + GreenMail（本地测试用 IMAP/SMTP 服务器）
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: damail
      POSTGRES_PASSWORD: damail
      POSTGRES_DB: damail
    ports:
      - "127.0.0.1:55434:5432"
    volumes:
      - damail-dev-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U damail"]
      interval: 5s
      retries: 10

  greenmail:
    image: greenmail/standalone:2.1.3
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap
        -Dgreenmail.users=alice:alice-pass@local.test,bob:bob-pass@local.test
        -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.verbose=false
    ports:
      - "127.0.0.1:3025:3025"
      - "127.0.0.1:3143:3143"

volumes:
  damail-dev-db:
